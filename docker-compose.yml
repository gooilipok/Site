version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=bau7824897_db
      - MYSQL_USER=bau_user
      - MYSQL_PASSWORD=bau_password
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-""}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-""}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_bau
      MYSQL_DATABASE: bau7824897_db
      MYSQL_USER: bau_user
      MYSQL_PASSWORD: bau_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro

volumes:
  mysql_data:
